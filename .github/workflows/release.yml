name: release

# A pushed tag vX.Y.Z: CI on macOS 15, 26 and 27, the release checks, then the GitHub Release with the source tarball.
# A published release is never changed; a defect ships as the next patch version.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # GitHub runs a ./ reusable workflow from the caller's own commit, not from the runner's workspace. actionlint
  # does not know the newer $/ form yet.
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  publish:
    name: publish
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its two assets
    steps:
      # fetch-depth 0 fetches every branch as origin/* (origin/main for the check below) and every tag.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against VERSION and main
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/check-release.sh "$TAG" origin/main
          # check-release.sh has just checked that VERSION is X.Y.Z.
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Make the source tarball
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.check.outputs.version }}
        run: scripts/make-release-tarball.sh "refs/tags/$TAG" "$VERSION" "$RUNNER_TEMP/out"

      # The last step that writes anything. gh uploads the assets to a draft and then publishes it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release create "$TAG" \
            "$RUNNER_TEMP/out/busysign-$VERSION.tar.gz" \
            "$RUNNER_TEMP/out/busysign-$VERSION.tar.gz.sha256" \
            --verify-tag --title "BusySign $VERSION" --generate-notes

      - name: Check the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.check.outputs.version }}
        run: gh release view "$TAG" --json assets --jq '.assets[].name' | scripts/check-release-assets.sh "$VERSION"
